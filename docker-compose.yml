name: wallet-api

services:
  oracle:
    image: gvenzl/oracle-free:23.26.4-slim-faststart
    container_name: wallet-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      # Consumed by db/bootstrap/01_schemas.sh (runs once, on first database creation).
      WALLET_OWNER_PASSWORD: ${WALLET_OWNER_PASSWORD:?set WALLET_OWNER_PASSWORD in .env}
      WALLET_AUDIT_PASSWORD: ${WALLET_AUDIT_PASSWORD:?set WALLET_AUDIT_PASSWORD in .env}
      WALLET_APP_PASSWORD: ${WALLET_APP_PASSWORD:?set WALLET_APP_PASSWORD in .env}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./db/bootstrap:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    shm_size: 1gb

  app:
    build:
      context: .
    container_name: wallet-api
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: WALLET_APP
      DB_PASSWORD: ${WALLET_APP_PASSWORD:?set WALLET_APP_PASSWORD in .env}
      DB_MIGRATION_USER: WALLET_OWNER
      DB_MIGRATION_PASSWORD: ${WALLET_OWNER_PASSWORD:?set WALLET_OWNER_PASSWORD in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      WALLET_API_KEYS: ${WALLET_API_KEYS:?set WALLET_API_KEYS in .env}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

volumes:
  oracle-data:
