spring:
  application:
    name: wallet-api

  # Every write goes through PKG_WALLET, which owns its own transaction and commits.
  # auto-commit MUST stay false: with auto-commit on, Oracle would commit right after the
  # SELECT ... FOR UPDATE and release the row lock before the balance update.
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USER:WALLET_APP}
    password: ${DB_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: wallet-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      validation-timeout: 3000
      auto-commit: false

  # Migrations run as the schema owner (DDL), never as the runtime user (least privilege).
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    user: ${DB_MIGRATION_USER:WALLET_OWNER}
    password: ${DB_MIGRATION_PASSWORD:}
    schemas: WALLET_OWNER
    default-schema: WALLET_OWNER
    create-schemas: false
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

wallet:
  database:
    # Schema that owns the ledger objects. The runtime user only has object grants,
    # so every SQL reference is schema qualified.
    schema: ${DB_SCHEMA:WALLET_OWNER}
  security:
    # Comma separated X-API-Key values. No default on purpose: the app refuses to start
    # without a key configured (see ApiSecurityProperties).
    api-keys: ${WALLET_API_KEYS:}
  pagination:
    default-page-size: 20
    max-page-size: ${WALLET_MAX_PAGE_SIZE:100}

logging:
  level:
    root: INFO
    com.wallet.api: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"

info:
  app:
    name: Wallet API
    description: Digital wallet with consistency enforced by Oracle PL/SQL
